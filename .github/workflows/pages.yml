name: pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

# One deploy at a time, and never cancel one half way: a partly uploaded site
# is worse than an old one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"
      - run: gleam deps download
      # Nothing broken goes up, whatever the tests cost.
      - run: gleam test
      - name: Build the web interface
        run: >
          gleam run -m lustre/dev build jazz_web
          --no-html --outdir=dist --minify=true
      - name: Add the page around it
        run: |
          cp web/index.html web/styles.css dist/
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
